<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>InkTanks detail test</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #1b1a16; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #columns { position: fixed; inset: 0; display: flex; }
    .col { position: relative; flex: 1 1 0; min-width: 0; height: 100%; overflow: hidden; border-left: 1px solid #000; }
    .col canvas { image-rendering: pixelated; display: block; }
    .tag { position: absolute; left: 8px; top: 8px; z-index: 2; font: 600 13px/1.3 ui-monospace, Menlo, monospace; color: #f4ecd8; background: rgba(20, 18, 14, 0.66); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
    #bar { position: fixed; right: 10px; bottom: 10px; z-index: 3; display: flex; gap: 8px; align-items: center; font: 600 13px ui-monospace, Menlo, monospace; color: #f4ecd8; }
    #bar span { background: rgba(20, 18, 14, 0.66); padding: 6px 9px; border-radius: 4px; }
    #bar button { font: 700 14px ui-monospace, Menlo, monospace; color: #f4ecd8; background: rgba(20, 18, 14, 0.8); border: 1px solid rgba(244, 236, 216, 0.4); border-radius: 6px; height: 34px; padding: 0 12px; }
  </style>
</head>
<body>
  <div id="columns"></div>
  <div id="bar"><span>showing <b id="which"></b></span><button id="cycle">D: next</button></div>
  <script type="module" src="./detail-test/main.ts"></script>
</body>
</html>
